spring.application.name=fitness
# H2 인메모리 데이터베이스 연결 설정
spring.datasource.url=jdbc:h2:mem:fitness_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 사용 활성화 (선택, 브라우저에서 /h2-console 로 접속해 DB 확인 가능)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA 설정 (테이블 자동 생성 등)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Google Gemini API 키 설정 (더미 값)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:dummy-key}
