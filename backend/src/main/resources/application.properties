spring.application.name=fitness

# H2 연결 설정
spring.datasource.url=jdbc:h2:mem:fitness_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# JPA 설정 (💡 데이터를 확실하게 새로 넣기 위해 잠시 create로 변경합니다)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 💡 대량 데이터 저장 속도를 획기적으로 올리기 위한 배치 설정
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Google Gemini API 키 설정 (환경변수 설정 필요)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:dummy-key}